# PostgreSQL + Strapi + Next.js.  Usage : cp .env.example .env && docker compose up --build
# Pour ne lancer que la base (développement local avec PostgreSQL) : docker compose up postgres
name: le-revenu-communaute

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-communaute}
      POSTGRES_USER: ${DATABASE_USERNAME:-communaute}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-communaute}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  strapi:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:?Renseignez APP_KEYS dans .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-communaute}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-communaute}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-communaute}
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      SEED_DEMO_DATA: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Communaute2026!}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.lerevenu.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "1337:1337"

  frontend:
    build: ./frontend
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STRAPI_URL: http://strapi:1337
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      DEMO_MODE: "true"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Communaute2026!}
    ports:
      - "3000:3000"

volumes:
  pgdata:
